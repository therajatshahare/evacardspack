name: Build and Release Eva Cards Pack

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew app:assembleRelease

      - name: Rename Release APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/evacardspack-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: release-output/evacardspack-${{ github.ref_name }}.apk
          name: "Eva Cards Pack ${{ github.ref_name }}"
          body: |
            Official Release ${{ github.ref_name }} of Eva Cards Pack for Eva Launcher on Android TV!
            
            ### Highlights
            - 5 Module Cards (Weather Live, Minimal Clock, Trending, Calendar, System Monitor)
            - 7-Column Monthly Grid Calendar with D-Pad navigation & Neo-Buddhist / Buddhist festivals
            - Frosted Glassmorphism TV design
            - Auto-Updater with TV installer
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
