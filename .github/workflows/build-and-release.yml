name: Build and Release Eva Cards Pack

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew app:assembleRelease

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/evacardspack-release.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evacardspack-release-apk
          path: release-output/evacardspack-release.apk

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: release-output/evacardspack-release.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v3.0.0' }}
          name: "Eva Cards Pack ${{ github.ref_type == 'tag' && github.ref_name || 'v3.0.0' }} (Stable Release)"
          body: |
            Official Release of Eva Cards Pack for Eva Launcher on Android TV!
            
            ### Highlights
            - 5 Module Cards (Weather Live, Minimal Clock, Trending, Calendar, System Monitor)
            - 7-Column Monthly Grid Calendar with D-Pad navigation & Neo-Buddhist / Buddhist festivals
            - Frosted Glassmorphism TV design
            - Auto-Updater with TV installer
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
